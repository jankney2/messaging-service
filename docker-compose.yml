version: "3.8"

services:
  app:
    build: .
    container_name: messaging-service-app
    environment:
      - NODE_ENV=development
      - POSTGRES_DB=messaging_service
      - POSTGRES_USER=messaging_user
      - POSTGRES_PASSWORD=messaging_password
      - POSTGRES_HOST=postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  postgres:
    image: postgres:15-alpine
    container_name: messaging-service-db
    environment:
      POSTGRES_DB: messaging_service
      POSTGRES_USER: messaging_user
      POSTGRES_PASSWORD: messaging_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messaging_user -d messaging_service"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
